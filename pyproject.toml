[project]
name = "IKEA_Assembly_Instruction_Processing"
version = "0.1.0"
description = "Generate Assembly Instructions for IKEA products Assembly Document using Docling, lancedb"
authors = [
    { name = "Anu", email = "anudalvi06@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "pymupdf>=1.23.12",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "lancedb>=0.29.2",
    "docling>=2.73.0",
    "playwright>=1.58.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"



[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "scripts*"]


